[project]
name = "aqft"
version = "3.1.0"
description = "AQF-T Autonomous Quantitative Fusion Trading System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
ai = ["torch>=2.0.0", "scikit-learn>=1.3.0", "xgboost>=1.7.0"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.0.280", "mypy>=1.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
